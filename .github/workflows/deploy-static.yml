name: Deploy static site

# Sube automáticamente la carpeta public/ (el sitio estático servido en
# femepashidi.com.mx/inicio) al hosting de Neubox por FTP cada vez que se
# hace push a main con cambios dentro de public/.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Neubox via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/
          server-dir: /femepashidi.com.mx/inicio/
